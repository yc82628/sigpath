# Anchor workspace root. Without this, `cargo build-sbf` emits the program into
# programs/sigpath/target/ while `anchor deploy` looks in target/deploy/ —
# producing "Unable to open program file".
[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# The orders program is optimised for SIZE, not speed. Deploy rent scales with
# the binary (~1.4 SOL for the program plus the same again held for the deploy
# buffer at 281 KB), while its instructions are a handful of token CPIs that
# are nowhere near the compute limit either way. Every KB saved is rent not
# spent. The attestation program keeps the default: it is already deployed,
# and changing its build would change the binary a redeploy would ship.
[profile.release.package.sigpath_orders]
opt-level = "z"
