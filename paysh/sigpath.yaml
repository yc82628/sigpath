# yaml-language-server: $schema=https://pay.sh/docs-assets/provider.schema.json
#
# SigPath's deal check for AI shopping agents, sold per request in USDC on
# Solana through a pay.sh gateway (https://pay.sh).
#
# An agent calls the gateway, gets HTTP 402 with the price, its wallet approves
# a USDC transfer, the gateway settles it on Solana and forwards the request to
# SigPath's /api/check with the shared gateway key. See /agents on the site.
#
# Run it (sandbox: hosted test network, test USDC, no account needed):
#   pay --sandbox gate api paysh/sigpath.yaml --bind 127.0.0.1:1402 --openapi ../public/openapi.json
# Then, as an agent would:
#   pay --sandbox curl "http://127.0.0.1:1402/api/check?q=ThinkPad%20X1"
#
# Going live: point routing.url at the deployed site, set operator.network to
# mainnet and operator.recipient to the wallet that should receive the USDC,
# and set SIGPATH_GATEWAY_KEY (same value) for both the gateway and the site.

name: sigpath
subdomain: sigpath
title: 'SigPath deal check and seller verification'
description: 'Search eBay and Amazon at once with a verdict on every listing, and verify sellers, businesses and suppliers: verified-seller badges on Solana, EU VAT-registered businesses, upheld fake-product reports, and supplier checks against the VAT register and domain registries.'
category: shopping
version: v1

routing:
  type: proxy
  # The SigPath site. Local dev server for the sandbox; the public URL in production.
  url: http://127.0.0.1:3000/
  # Proves to SigPath that a request was paid for (lib/agents/check.ts).
  auth:
    method: header
    key: 'x-sigpath-gateway'
    value_from_env: SIGPATH_GATEWAY_KEY

operator:
  currencies:
    usd: ['USDC']
  # The sandbox flag picks the test network; set mainnet when going live.
  # network: mainnet
  # recipient: '<the wallet that receives the USDC, base58>'
  fee_payer: true

endpoints:
  - method: GET
    path: 'api/check'
    description: 'Deal check for ?q=<what to buy>: every listing with its verdict and reasons, plus the best checked deal for new and for used.'
    metering:
      dimensions:
        - direction: usage
          unit: requests
          scale: 1
          tiers:
            - price_usd: 0.002

  - method: GET
    path: 'api/v1/seller'
    description: 'Is ?marketplace=ebay|amazon&handle=<seller> a verified seller (cross-checked on Solana)? Which verified business runs it? Upheld fake-product findings.'
    metering:
      dimensions:
        - direction: usage
          unit: requests
          scale: 1
          tiers:
            - price_usd: 0.001

  - method: GET
    path: 'api/v1/business'
    description: 'A verified business by ?vatCountry=DE&vatNumber=..., ?domain=... or ?id=...: status, VAT and website evidence, linked accounts.'
    metering:
      dimensions:
        - direction: usage
          unit: requests
          scale: 1
          tiers:
            - price_usd: 0.001

  - method: POST
    path: 'api/v1/supplier'
    description: 'Supplier check from a JSON body (vatCountry, vatNumber, name, domain, marketplace, handle): EU VAT register, name match, website age from its registry, and SigPath records.'
    metering:
      dimensions:
        - direction: usage
          unit: requests
          scale: 1
          tiers:
            - price_usd: 0.005

quotas:
  requests_per_minute: 60

notes: 'Answers are the same as on the free website: paying never changes a result. Checked means compared with the same product and condition, and no seller or photo check that could run raised a flag; it is not a guarantee the item is genuine. Verification vouches for who runs an account, not for any item.'
