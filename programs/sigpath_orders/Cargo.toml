[package]
name = "sigpath_orders"
version = "0.1.0"
description = "SigPath order escrow: USDC held by the program, released on fulfilment, refunded on timeout"
edition = "2021"
rust-version = "1.75"

[lib]
crate-type = ["cdylib", "lib"]
name = "sigpath_orders"

[features]
# Both on by default, to cut deploy rent: 251 KB -> 204 KB, 1.276 -> 1.038 SOL.
# no-idl drops Anchor's on-chain IDL instructions (nothing here publishes an
# IDL; the TS clients build instructions by hand), no-log-ix-name drops the
# "Instruction: X" log line per call (nothing parses it). Behaviour is
# otherwise identical: orders-roundtrip and checkout-e2e pass 19/19 on it.
default = ["no-idl", "no-log-ix-name"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

# anchor-lang ONLY — deliberately no anchor-spl. The build uses platform-tools
# Rust 1.75, which cannot compile the newer crates anchor-spl pulls in, and the
# workspace Cargo.lock is seeded to avoid exactly that fight. Token transfers
# are therefore hand-built CPIs into the SPL Token program (see lib.rs), the
# same approach the attestation program takes with its client instructions.
[dependencies]
anchor-lang = "0.30.1"
